name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: clang++
          - os: windows-latest
            compiler: cl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build --config Debug
      - name: Compile without exceptions or RTTI
        if: runner.os == 'Linux'
        run: ${{ matrix.compiler }} -std=c++98 -Os -ffreestanding -fno-exceptions -fno-rtti -Wall -Wextra -Wpedantic -Werror -c MimeTypes.cpp -o build/MimeTypes-embedded.o
      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DMIMETYPES_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
